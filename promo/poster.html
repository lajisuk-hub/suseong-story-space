<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Pretendard", sans-serif; color: #fff; overflow: hidden; background: #1a1147; }
  .jua { font-family: "Jua", sans-serif; font-weight: 400; }
  .poster { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url(../public/space1.jpg) center / cover no-repeat; }
  .shade { position: absolute; inset: 0; }
  .glow { text-shadow: 0 4px 22px rgba(40,10,110,.95), 0 0 6px rgba(40,10,110,.9); }
  .book { position: absolute; aspect-ratio: 3/4; border-radius: 5px 12px 12px 5px; overflow: hidden;
    box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 36px 8px rgba(255,236,170,.85), 0 0 90px 18px rgba(190,140,255,.6), 0 22px 40px rgba(20,5,70,.55); }
  .book img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 9%; z-index: 1; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.28) 45%, rgba(0,0,0,.12) 70%, transparent); }
  .word { position: absolute; white-space: nowrap; font-family: "Jua", sans-serif; -webkit-text-stroke: .22em rgba(58,28,140,.8); paint-order: stroke fill;
    text-shadow: 0 0 14px rgba(70,30,160,.9), 0 0 30px rgba(120,70,220,.5); }
  .qr { background: #fff; border-radius: 28px; padding: 18px; box-shadow: 0 0 0 6px rgba(255,255,255,.35), 0 20px 60px rgba(30,5,90,.6), 0 0 80px rgba(255,220,150,.55); }
  .qr img { display: block; width: 100%; border-radius: 12px; }
  .step { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.93); color: #33206e; border-radius: 26px; box-shadow: 0 10px 30px rgba(30,5,90,.4); }
  .num { flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(135deg, #8a5cf6, #ec6fc1); font-family: "Jua", sans-serif; }
  .step b { font-family: "Jua", sans-serif; font-weight: 400; display: block; }
  .step span { color: #6a55ad; display: block; }
  .url { font-family: "Jua", sans-serif; letter-spacing: .02em; color: #fff; background: rgba(60,30,150,.78); border-radius: 999px; display: inline-block; }

  /* ── 세로(A4) ── */
  .portrait .shade { background: linear-gradient(180deg, rgba(24,10,70,.6) 0%, rgba(24,10,70,.08) 17%, rgba(24,10,70,0) 40%, rgba(30,10,84,.85) 51%, rgba(30,10,84,1) 56%, rgba(44,18,110,1) 100%); }
  .portrait .bg { background-position: 50% 0; background-size: auto 60%; background-color: #1e0a54; }
  .portrait .head { position: absolute; top: 2.4%; left: 0; right: 0; text-align: center; }
  .portrait .badge { display: inline-block; font-size: 2.1vw; padding: .6vw 2.2vw; border-radius: 999px; background: rgba(255,255,255,.9); color: #5a3fb5; font-weight: 700; letter-spacing: .08em; }
  .portrait h1 { font-size: 6.9vw; margin-top: .9vw; letter-spacing: .01em; }
  .portrait h2 { font-size: 3.4vw; margin-top: .2vw; color: #fff3c4; }
  .portrait .b1 { width: 21vw; left: 8%; top: 25%; transform: rotate(-8deg); }
  .portrait .b2 { width: 17vw; right: 7%; top: 23%; transform: rotate(7deg); }
  .portrait .b3 { width: 13vw; right: 30%; top: 39.5%; transform: rotate(-4deg); }
  .portrait .steps { position: absolute; left: 7%; right: 7%; top: 54%; display: grid; gap: 1.5vw; }
  .portrait .step { padding: 1.2vw 2.4vw; }
  .portrait .num { width: 5.6vw; height: 5.6vw; font-size: 3.2vw; }
  .portrait .step b { font-size: 3.3vw; }
  .portrait .step span { font-size: 2.05vw; margin-top: .3vw; }
  .portrait .bottom { position: absolute; left: 7%; right: 7%; bottom: 2.4%; display: flex; align-items: center; gap: 4vw; }
  .portrait .qr { width: 24.5vw; flex: none; padding: 14px; }
  .portrait .say { font-size: 4.3vw; line-height: 1.3; }
  .portrait .say small { display: block; font-family: "Pretendard"; font-size: 2.2vw; margin-top: 1.2vw; opacity: .92; line-height: 1.5; }
  .portrait .url { font-size: 2.5vw; padding: .9vw 2.2vw; margin-top: 1.6vw; }

  /* ── 가로(16:9) ── */
  .landscape .shade { background: linear-gradient(90deg, rgba(24,10,70,.15) 0%, rgba(24,10,70,0) 40%, rgba(30,10,84,.55) 62%, rgba(30,10,84,.88) 100%), linear-gradient(180deg, rgba(24,10,70,.5), rgba(24,10,70,0) 30%); }
  .landscape .head { position: absolute; top: 5%; left: 4%; width: 58%; }
  .landscape .badge { display: inline-block; font-size: 1.15vw; padding: .35vw 1.2vw; border-radius: 999px; background: rgba(255,255,255,.9); color: #5a3fb5; font-weight: 700; letter-spacing: .08em; }
  .landscape h1 { font-size: 4.3vw; margin-top: .8vw; }
  .landscape h2 { font-size: 2.1vw; margin-top: .5vw; color: #fff3c4; }
  .landscape .b1 { width: 12.5vw; left: 4.5%; top: 33%; transform: rotate(-8deg); }
  .landscape .b2 { width: 10.5vw; left: 22%; top: 50%; transform: rotate(7deg); }
  .landscape .b3 { width: 9vw; left: 47%; top: 63%; transform: rotate(-4deg); }
  .landscape .side { position: absolute; right: 3.5%; top: 7%; bottom: 6%; width: 33%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
  .landscape .qr { width: 17vw; }
  .landscape .say { font-size: 2.3vw; }
  .landscape .url { font-size: 1.3vw; padding: .45vw 1.3vw; margin-top: .7vw; }
  .landscape .steps { display: grid; gap: .8vw; width: 100%; text-align: left; }
  .landscape .step { padding: .8vw 1.3vw; gap: 1vw; border-radius: 1.3vw; }
  .landscape .num { width: 3.2vw; height: 3.2vw; font-size: 1.8vw; }
  .landscape .step b { font-size: 1.65vw; }
  .landscape .step span { font-size: 1.02vw; margin-top: .15vw; }
</style>
</head>
<body>
<script>
  const mode = new URLSearchParams(location.search).get("m") === "l" ? "landscape" : "portrait";
  const P = mode === "portrait";
  const words = P
    ? [["감동이에요", 5.2, 37, 31.5, "#ffe9a8"], ["따뜻해요", 3.4, 9, 46.5, "#ffd6ee"], ["또 보고 싶어요", 2.5, 71, 47.5, "#cdf1ff"], ["최고예요", 2.8, 60, 17.5, "#fff"], ["사랑스러워요", 2.3, 30, 49, "#dcffd9"]]
    : [["감동이에요", 3.4, 19, 34, "#ffe9a8"], ["따뜻해요", 2.2, 3, 82, "#ffd6ee"], ["또 보고 싶어요", 1.6, 34, 86, "#cdf1ff"], ["최고예요", 1.9, 31, 25, "#fff"], ["사랑스러워요", 1.5, 35, 66, "#dcffd9"]];
  const steps = [
    ["QR을 휴대폰으로 찍어요", "카메라를 켜고 QR에 가까이 대면 전시관이 열려요"],
    ["떠다니는 동화책을 눌러 읽어요", "화면을 옆으로 밀면 넓은 우주를 여행할 수 있어요"],
    ["소감 한마디를 우주에 띄워요", "같은 말이 모일수록 글자가 점점 커져요"],
  ];
  const stepsHtml = `<div class="steps">${steps.map((s, i) => `<div class="step"><div class="num">${i + 1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("")}</div>`;
  const qrHtml = `<div class="qr"><img src="qr-suseong-story-space.png"></div>`;
  const url = `<div class="url">suseong-story-space.vercel.app</div>`;
  document.body.innerHTML = `
  <div class="poster ${mode}">
    <div class="bg"></div><div class="shade"></div>
    <div class="head">
      <span class="badge">동화책 우주 전시관</span>
      <h1 class="jua glow">수성구 AI 선도기관 성과전시회</h1>
      <h2 class="jua glow">읽고싶은 책을 클릭 후 소감을 남겨주세요!</h2>
    </div>
    ${words.map((w) => `<div class="word" style="font-size:${w[1]}vw;left:${w[2]}%;top:${w[3]}%;color:${w[4]}">${w[0]}</div>`).join("")}
    <div class="book b1"><img src="../public/books/palace2/p01.jpg"></div>
    <div class="book b2"><img src="../public/books/palace2/p07.jpg"></div>
    <div class="book b3"><img src="../public/books/palace2/p13.jpg"></div>
    ${P
      ? `${stepsHtml}<div class="bottom">${qrHtml}<div><div class="say jua glow">휴대폰으로 찍고<br>우주 전시관으로 입장!<small>AI와 함께 만든 우리 어린이집 동화책이<br>우주에 둥둥 떠다니고 있어요</small></div>${url}</div></div>`
      : `<div class="side"><div><div class="say jua glow">휴대폰으로 찍고 입장!</div></div>${qrHtml}${url}${stepsHtml}</div>`}
  </div>`;
</script>
</body>
</html>
