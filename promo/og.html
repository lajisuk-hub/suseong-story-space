<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #fff; font-family: "Jua", sans-serif; background: url(../public/space1.jpg) -330px 40% / 1560px auto; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(30,10,84,.96) 0%, rgba(30,10,84,.93) 50%, rgba(30,10,84,.35) 66%, rgba(30,10,84,0) 80%); }
  .txt { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); width: 640px; }
  .badge { display: inline-block; font-size: 24px; letter-spacing: .14em; padding: 8px 24px; border-radius: 999px; color: #5a3fb5; background: rgba(255,255,255,.93); }
  .hello { font-size: 96px; line-height: 1.1; color: #ffe08a; text-shadow: 0 4px 24px rgba(40,10,110,.9); }
  h1 { font-weight: 400; font-size: 46px; white-space: nowrap; line-height: 1.2; margin-top: 18px; text-shadow: 0 4px 24px rgba(40,10,110,.9); word-break: keep-all; }
  p { font-family: "Gowun Batang", serif; font-size: 26px; white-space: nowrap; line-height: 1.5; margin-top: 20px; color: #fff3c4; }
  p.when { font-family: "Jua", sans-serif; font-size: 28px; color: #fff; margin-top: 22px; padding-top: 18px; border-top: 2px solid rgba(255,255,255,.35); display: inline-block; }
  img { position: absolute; border-radius: 5px 12px 12px 5px; box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 36px 8px rgba(255,236,170,.85), 0 0 80px 16px rgba(190,140,255,.6); }
</style>
</head>
<body>
  <div class="shade"></div>
  <img src="../public/books/palace2/p01.jpg" style="width:190px; right:70px; top:70px; transform:rotate(7deg)">
  <img src="../public/books/palace2/p07.jpg" style="width:150px; right:300px; bottom:60px; transform:rotate(-6deg)">
  <div class="txt">
    <div class="hello">💌 초대합니다</div>
    <h1>수성구 AI 영유아 선도기관<br>성과보고 발표회</h1>
    <p>수성구 영유아를 위한 단 한 권의 동화책!<br>그 준비과정과 성장과정을 마음 담아 전달합니다</p>
    <p class="when">2026. 10. 13.(화) 오후 4시 · 수성구청 지하 대강당</p>
  </div>
</body>
</html>
